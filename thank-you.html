<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thank You | Byron &amp; Beyond Fencing</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B5AA3">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0B5AA3;
      --navy-hover: #094a87;
      --sky: #34BEE0;
      --ink: #15263A;
      --text: #3B4654;
      --muted: #6B7785;
      --line: #E3E8EE;
      --bg-soft: #F3F6F9;
      --gutter: 20px;
      --font-head: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      background: linear-gradient(180deg, #fff 0%, var(--bg-soft) 100%);
      color: var(--text);
      font: 400 16px/1.65 var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    .wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 var(--gutter); }

    .site-header { height: 68px; }
    .site-header .wrap { height: 100%; display: flex; align-items: center; }
    .logo img { height: 42px; width: auto; }

    main { flex: 1; display: grid; place-items: center; padding: 48px 0 72px; }
    .thanks { max-width: 560px; margin: 0 auto; text-align: center; }
    .tick {
      width: 72px; height: 72px; margin: 0 auto 28px;
      border-radius: 50%; background: #E4F5FB;
      display: grid; place-items: center;
    }
    .tick svg { width: 34px; height: 34px; }
    h1 {
      margin: 0;
      font: 500 clamp(2.4rem, 6vw, 3.5rem)/1.08 var(--font-head);
      letter-spacing: -0.02em; color: var(--ink);
    }
    .thanks p { margin: 18px 0 0; font-size: 1.1rem; text-wrap: balance; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 56px; margin-top: 36px; padding: 0 30px;
      border-radius: 999px; background: var(--navy); color: #fff;
      font: 500 1.05rem/1 var(--font-body); letter-spacing: .02em;
      text-decoration: none;
      transition: background-color .15s ease;
    }
    .btn:hover { background: var(--navy-hover); }
    .btn:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }

    .site-footer { padding: 28px 0; font-size: .85rem; color: var(--muted); text-align: center; }

    @media (max-width: 767px) {
      :root { --gutter: 16px; }
      .site-header { height: 60px; }
      .logo img { height: 34px; }
      .thanks p { font-size: 1.02rem; }
      .btn { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="https://www.byronandbeyondfencing.com.au/" aria-label="Byron &amp; Beyond Fencing home">
        <img src="assets/logo.png" alt="Byron &amp; Beyond Fencing" width="109" height="42">
      </a>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="thanks">
        <div class="tick" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0B5AA3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h1>Thank you!</h1>
        <p>We've got your details and we'll be in touch within 1 business day.</p>
        <a class="btn" href="https://www.byronandbeyondfencing.com.au/">Visit our main website <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© <span id="year">2026</span> Byron &amp; Beyond Fencing · Northern Rivers, NSW</p>
    </div>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
